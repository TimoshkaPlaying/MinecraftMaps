<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="download.css" rel="stylesheet"></link>
    <script src="download.js" defer></script>

    <link rel="stylesheet" href="https://pyscript.net/alpha/pyscript.css" />
    <script defer src="https://pyscript.net/alpha/pyscript.js"></script>

    <title>Загрузка своей карты</title>
</head>
<body>
    <header>
        <button class="back" onclick="location.href='index.html';">Назад</button>
    </header>
    <main>
        <div class="addCardMenu">
            <form id="uploadForm">
                <div class="cardOptionsInput">
                    <h3>Введите название вашей карты:</h3>
                    <input type="text" class="cardName">
                </div>
                <div class="cardOptionsInput">
                    <h3>Введите краткое описание вашей карты:</h3>
                    <input type="text" class="cardDescription">
                </div>
                <div class="cardOptionsInput">
                    <h3>Введите полное описание вашей карты:</h3>
                    <input type="text" class="cardMoreDescription">
                </div>
                <div class="cardOptionsInput">
                    <h3>Загрузите главное изображение:</h3>
                    <input type="file" class="cardMainImage file">
                </div>
                <div class="cardOptionsInput">
                    <h3>Загрузите дополнительные изображения:</h3>
                    <input type="file" class="cardImages file" multiple>
                </div>
                <div class="cardOptionsInput">
                    <h3>Загрузите архив с вашей картой:</h3>
                    <input type="file" class="cardFile file">
                </div>
                <div class="cardOptionsInput">
                    <h3>Выберите версию вашей карты:</h3>
                    <select class="cardVersion">
                        <option value="1.12.2">1.12.2</option>
                        <option value="1.14.4">1.14.4</option>
                        <option value="1.16.5">1.16.5</option>
                        <option value="1.18.2">1.18.2</option>
                        <option value="1.19.2">1.19.2</option>
                        <option value="1.20.1">1.20.1</option>
                    </select>
                </div>
                <div class="cardOptionsInput">
                    <button class="releaseButton">Опубликовать</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
